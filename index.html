<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Bear Sync</title>
<style>
/* One column: token setup, note picker, actions. Phone first. Holds no note content itself. */
:root {
  --bg: #f6f5f3; --surface: #ffffff; --fg: #22201f; --muted: #6d6864;
  --line: #e4e0dc; --accent: #c2413b; --accent-fg: #ffffff; --ok: #2f7d4f; --err: #b3261e;
  --display: "New York", "Iowan Old Style", Georgia, serif;
  --body: -apple-system, system-ui, "Segoe UI", sans-serif;
  --mono: ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1817; --surface: #242120; --fg: #ece8e4; --muted: #a39d98;
    --line: #37322f; --accent: #e5625b; --accent-fg: #1a1817; --ok: #6cc08f; --err: #f2867f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body);
  padding: 0 16px; padding-block: calc(28px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font: 600 2rem/1.1 var(--display); margin: 0; }
.lede { color: var(--muted); margin: 6px 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
h2 { font: 500 1.35rem/1.2 var(--display); margin: 0; }
label { font-weight: 600; font-size: 0.9rem; }
input, select {
  font: 16px var(--body); width: 100%; padding: 11px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-height: 44px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: 600 0.95rem/1 var(--body); padding: 12px 16px; border-radius: 8px; cursor: pointer;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); background: transparent; color: var(--fg); min-height: 44px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); flex: 1 1 180px; }
.btn[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { font: 0.75rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.status { font-size: 0.88rem; min-height: 1.3em; margin: 0; color: var(--ok); }
.status.err { color: var(--err); }
.hint { color: var(--muted); font-size: 0.88rem; margin: 0; }
pre {
  white-space: pre-wrap; overflow-wrap: anywhere; font: 0.78rem/1.55 var(--mono);
  margin: 0; max-height: 45vh; overflow: auto; border-top: 1px solid var(--line); padding-top: 10px;
}
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 0.85rem; cursor: pointer; justify-self: start; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bear Sync</h1>
    <p class="lede">Pick a Roshar daily note and send it to the Bear note with the same title. The body of that Bear note is replaced.</p>
  </header>

  <section class="card" id="setup" hidden>
    <h2>Connect to Roshar</h2>
    <p class="hint">Paste a fine-grained GitHub token with read-only Contents access to <code>shyaamlal/roshar</code>. It is kept in this browser only.</p>
    <label for="token">GitHub token</label>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
    <div class="row"><button class="btn primary" id="save" type="button">Save and load notes</button></div>
    <p class="status" id="setup-status" aria-live="polite"></p>
  </section>

  <section class="card" id="main" hidden>
    <label for="note">Daily note</label>
    <select id="note"></select>
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h2 id="bear-title">…</h2><span class="meta" id="chars"></span>
    </div>
    <div class="row">
      <a class="btn primary" id="send" aria-disabled="true" href="#">Send to Bear</a>
      <button class="btn" id="copy" type="button">Copy text</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <pre id="text"></pre>
    <button class="link" id="forget" type="button">Remove token from this browser</button>
  </section>
</div>

<script>
const OWNER = "shyaamlal", REPO = "roshar", BRANCH = "main", DIR = "Stormlight";
const KEY = "bear-sync-token";
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $ = id => document.getElementById(id);

function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// Same cleanup as .claude/bear_link.py: drop YAML frontmatter and a leading "# " heading.
function bodyOf(raw) {
  let t = raw.replace(/\r\n/g, "\n");
  t = t.replace(/^---\n[\s\S]*?\n---\n/, "").replace(/^\n+/, "");
  t = t.replace(/^# .*\n/, "").replace(/^\n+/, "");
  return t;
}
// "2026-10-07.md" -> "07 Oct 2026", the Bear note title.
function titleOf(name) {
  const m = name.match(/^(\d{4})-(\d{2})-(\d{2})\.md$/);
  return m ? `${m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}` : null;
}
function bearUrl(title, text) {
  const q = { title, mode: "replace", text, open_note: "yes" };
  return "bear://x-callback-url/add-text?" + Object.entries(q).map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
}

async function gh(path, raw) {
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`, {
    headers: { Authorization: "Bearer " + load(KEY), Accept: raw ? "application/vnd.github.raw" : "application/vnd.github+json" },
    cache: "no-store",
  });
  if (r.status === 401) throw new Error("GitHub rejected the token. Check it hasn't expired, then paste it again.");
  if (r.status === 404) throw new Error("GitHub couldn't find shyaamlal/roshar with this token. Check the token has access to that repo.");
  if (!r.ok) throw new Error(`GitHub returned ${r.status}. Try again in a minute.`);
  return raw ? r.text() : r.json();
}

let current = null;
function setStatus(el, msg, err) { el.textContent = msg; el.classList.toggle("err", !!err); }

async function loadList() {
  const items = await gh(DIR);
  const notes = items.filter(i => i.type === "file" && titleOf(i.name)).map(i => i.name).sort().reverse();
  const sel = $("note");
  sel.innerHTML = "";
  for (const n of notes) { const o = document.createElement("option"); o.value = n; o.textContent = `${titleOf(n)}  (${n})`; sel.append(o); }
  $("setup").hidden = true; $("main").hidden = false;
  if (notes.length) await loadNote(notes[0]);
}

async function loadNote(name) {
  const send = $("send");
  send.setAttribute("aria-disabled", "true"); send.href = "#";
  $("bear-title").textContent = titleOf(name); $("text").textContent = ""; $("chars").textContent = "";
  setStatus($("status"), "Loading…");
  try {
    const text = bodyOf(await gh(`${DIR}/${name}`, true));
    current = { title: titleOf(name), text };
    $("text").textContent = text;
    $("chars").textContent = text.length.toLocaleString() + " chars";
    send.href = bearUrl(current.title, text);
    send.setAttribute("aria-disabled", "false");
    setStatus($("status"), "");
  } catch (e) { setStatus($("status"), e.message, true); }
}

$("save").addEventListener("click", async () => {
  const t = $("token").value.trim();
  if (!t) return setStatus($("setup-status"), "Paste the token first.", true);
  store(KEY, t); $("token").value = "";
  setStatus($("setup-status"), "Loading notes…");
  try { await loadList(); } catch (e) { store(KEY, null); setStatus($("setup-status"), e.message, true); }
});
$("note").addEventListener("change", e => loadNote(e.target.value));
$("send").addEventListener("click", () => setStatus($("status"), `Opening Bear to replace “${current.title}”.`));
$("copy").addEventListener("click", () => {
  if (!current) return;
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents($("text"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    setStatus($("status"), "Copy was blocked. The text is selected below, copy it from there.", true);
  };
  try { navigator.clipboard.writeText(current.text).then(() => setStatus($("status"), `Copied. Paste it over the body of “${current.title}” in Bear.`), fallback); }
  catch (e) { fallback(); }
});
$("forget").addEventListener("click", () => { store(KEY, null); $("main").hidden = true; $("setup").hidden = false; setStatus($("setup-status"), "Token removed from this browser."); });

if (load(KEY)) loadList().catch(e => { $("setup").hidden = false; setStatus($("setup-status"), e.message, true); });
else $("setup").hidden = false;
</script>
</body>
</html>
